version: 2

models:
  - name: mart_pipeline_freshness
    description: >
      One row per registered source. The pipeline's own health: when each
      source last loaded, how many rows it holds, how many the last ingestion
      run added, how stale it is against its SLA, and how its tests did on
      the most recent completed dbt run.

      Read is_healthy first; the other columns explain it. Note that the test
      columns describe the previous completed run rather than the run that
      built this table, because dbt writes run results after models finish.
      See macros/audit_run_results.sql.

      Named mart_ rather than fct_, dim_ or agg_ because it describes the
      pipeline instead of the city. It is the one metadata mart and the
      prefix is what keeps it findable as such.
    columns:
      - name: source_name
        description: Registry name of the source, e.g. 311_cases. The grain of this model.
        tests:
          - unique
          - not_null

      - name: source_table
        description: Raw table the source lands in, e.g. raw_311_cases.
        tests:
          - not_null

      - name: staging_model
        description: >
          Staging model built from this source. Also the join key to dbt's
          test results, which is why it has to match the model name exactly.
        tests:
          - not_null

      - name: tier
        description: >
          core, reference or demoted, per ADR-7. Reference sources are the
          boundary sets: they change every several years, so staleness is not
          a signal and they carry no SLA, but they are not demoted either
          because every spatial mart depends on them. Demoted sources carry
          no SLA and earn no maintenance.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["core", "reference", "demoted"]

      - name: row_count
        description: Rows currently in the raw table, counted directly rather than accumulated.
        tests:
          - not_null

      - name: row_delta
        description: >
          Rows the most recent ingestion run added. 0 is the common healthy
          case: the run went out, found nothing new, and wrote nothing.

      - name: previous_row_count
        description: row_count minus row_delta, i.e. the count before the last run.

      - name: last_load_at
        description: When rows last landed in the raw zone. Null if nothing has ever loaded.

      - name: last_run_finished_at
        description: >
          When ingestion last ran at all, successful or not. Later than
          last_load_at whenever recent runs found nothing new.

      - name: last_run_status
        description: success or failed, from the ingestion run manifest.
        tests:
          - accepted_values:
              arguments:
                values: ["success", "failed"]
              config:
                severity: warn

      - name: hours_since_load
        description: >
          Hours since last_load_at, fractional, in UTC on both engines. See
          x_utc_now in macros/cross_engine.sql for why that needed saying.

      - name: hours_since_run_attempt
        description: Hours since ingestion last ran, fractional.

      - name: stale_after_hours
        description: Freshness SLA in hours. Null means the source has no SLA.

      - name: is_stale
        description: >
          Whether hours_since_load has passed stale_after_hours. Always false
          for sources with no SLA, so this never fires on a demoted source.
        tests:
          - not_null

      - name: tests_total
        description: Tests run against this source's staging model in the last completed dbt run.

      - name: tests_passed
        description: Of those, how many passed.

      - name: tests_failed
        description: Of those, how many failed.

      - name: tests_warned
        description: Of those, how many warned. Warnings are signals, not failures.

      - name: tests_errored
        description: Of those, how many errored, meaning the test itself could not run.

      - name: last_test_run_at
        description: When that dbt run started. Null before the second ever run.

      - name: point_count
        description: >
          Rows this source contributed to the spatial precompute. Null for a
          source with no point geometry, which is how a non-spatial source is
          told apart from a spatial one whose coordinates all failed.

      - name: usable_point_count
        description: Of those, how many produced a coordinate inside San Francisco.

      - name: missing_coordinate_count
        description: >
          Rows with no coordinate at all. Expected to be nonzero forever and
          deliberately not counted against health.

      - name: out_of_bounds_count
        description: >
          Rows whose coordinate is a real place outside San Francisco. Almost
          entirely registered businesses located elsewhere, which is correct
          data, so this does not count against health either.

      - name: malformed_coordinate_count
        description: >
          Rows whose coordinate could not be parsed or was not on Earth.
          Unlike the two above this is a pipeline fault, not a fact about the
          world, so any value above zero makes is_healthy false. It is the
          shape an upstream column change takes.

      - name: coordinate_drop_rate_pct
        description: >
          Percentage of this source's rows that could not be placed on a map,
          all four reasons combined. Measured 2026-07-31: 311 1.20, permits
          0.12, street trees 1.58, film locations 3.93, business locations
          18.27. The last is high because the registry records businesses
          located outside the city, not because it is dirty.

      - name: is_healthy
        description: >
          False if the last ingestion run failed, if any test failed or
          errored, if any coordinate was malformed, or if the source is past
          its SLA. True otherwise. The single column to read when checking in.
        tests:
          - not_null

  - name: dim_neighborhood
    description: >
      One row per analysis neighborhood, 41 rows. The denominator table, and
      the model most worth reading before trusting a rate in this warehouse.

      Population is an estimate twice over. The Census publishes it by block
      group, block groups do not nest inside neighborhoods, and rather than
      clip polygons this sums population over the H3 cells each neighborhood
      owns. So residents are assumed uniform within a block group, and a
      boundary cell's residents all go to whichever neighborhood owns the
      cell. Good to about a percent at r10, and not a census count.

      The plan that commissioned this asked for rates per parcel and per
      street mile. Neither dataset is in scope, so what is here instead is
      residents, housing units, land area and registered businesses. ADR-7
      records the gap.
    columns:
      - name: analysis_neighborhood
        description: Neighborhood name. The grain of this model.
        tests:
          - unique
          - not_null

      - name: area_sq_km
        description: Spherical area from ingestion/geometry.py.
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 0, max_value: 100}

      - name: population
        description: >
          Interpolated 2020 residents. Zero is possible in principle and does
          not occur today; every rate divides through x_safe_divide anyway.
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 0, max_value: 200000}

      - name: housing_units
        description: Interpolated 2020 housing units.
        tests:
          - not_null

      - name: business_count
        description: >
          Registered business locations, ever. The right denominator for a
          historical commercial rate; use active_business_count for a current
          one, and note the two differ by more than half.
        tests:
          - not_null

      - name: h3_cell_count
        description: >
          How many r10 cells this neighborhood owns. A coverage diagnostic: a
          neighborhood whose cell count is out of line with its area has a
          boundary problem, not a population problem.
        tests:
          - not_null

  - name: dim_supervisor_district
    description: >
      One row per supervisor district, 11 rows, on the 2022 boundaries. Built
      the same way as dim_neighborhood, with the same caveat about
      interpolated population.

      Worth repeating here because it bites differently: these are the 2022
      lines, and every event row from before then carries an upstream district
      assigned under the 2012 lines. A query joining on the upstream column
      and one joining on supervisor_district_id will disagree, and neither is
      wrong; they answer "which district was this in at the time" and "which
      district is this in now".
    columns:
      - name: supervisor_district
        description: District number, 1 to 11. The grain of this model.
        tests:
          - unique
          - not_null
          - accepted_range:
              arguments: {min_value: 1, max_value: 11}

      - name: supervisor_district_id
        description: >
          The same value as a string, which is what the H3 bridge and the
          point staging models carry. Kept so the join does not need a cast
          on one side.
        tests:
          - unique
          - not_null

      - name: population
        description: Interpolated 2020 residents.
        tests:
          - not_null

      - name: area_sq_km
        description: Spherical area from ingestion/geometry.py.
        tests:
          - not_null

  - name: mart_activity_by_h3
    description: >
      One row per H3 cell per dataset per category per month, at
      var('h3_mart_resolution'), currently 9.

      The hexagon map. Read the rate, not the count: a raw count per cell is
      close to a map of where people live, so the densest 311 cells are the
      densest residential cells and ranking on event_count mostly rediscovers
      the census. events_per_1000_residents is the column worth ranking on.

      Note that events_per_sq_km is the count rescaled by a constant, because
      every cell at a fixed resolution has the same area. It is here to be
      comparable with the neighborhood mart, where areas genuinely differ,
      and for no other reason.
    columns:
      - name: h3_cell
        description: The cell as a BIGINT. Part of the grain.
        tests:
          - not_null

      - name: h3_resolution
        description: The resolution this mart was built at. Constant per build.
        tests:
          - not_null

      - name: dataset
        description: Registry name of the source. Part of the grain.
        tests:
          - not_null

      - name: event_month
        description: First day of the month. Part of the grain.
        tests:
          - not_null

      - name: analysis_neighborhood
        description: >
          The neighborhood owning this cell, for filtering and labelling.
          Null where the cell's centre is outside every neighborhood, which
          is water or just past the city line.
        tests:
          - relationships:
              arguments:
                to: ref('dim_neighborhood')
                field: analysis_neighborhood

      - name: event_count
        description: Events in this cell, dataset, category and month.
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 1}

      - name: cell_population
        description: >
          Interpolated residents in this cell. Null where the cell has no
          block group overlap at all, zero where it genuinely has nobody.

      - name: events_per_1000_residents
        description: >
          The normalised companion, and the one to rank on. Null rather than
          infinite where the cell has no residents, which is correct and
          common: the bay, the Presidio and the Financial District all have
          real activity and close to nobody living in them.

      - name: events_per_sq_km
        description: >
          Density. A constant rescaling of event_count at fixed resolution,
          so it ranks identically; kept for comparability with the
          neighborhood mart.
        tests:
          - not_null

    tests:
      - unique_combination:
          arguments:
            columns: [h3_cell, dataset, category, event_month]

  - name: mart_activity_by_neighborhood
    description: >
      One row per neighborhood per dataset per category per month. The model
      behind "count 311 cases inside this neighborhood", and the thing worth
      noticing is what is not in it: no geometry function, no spatial join,
      no extension. The neighborhood on every row was decided by an integer
      H3 cell lookup at precompute time, and this model does a group by on
      the resulting string.

      Four denominators, and they disagree with each other on purpose.
      Ranking by raw count returns a population map; ranking by rate returns
      a different list depending on what you divide by, and that disagreement
      is information. Per 1000 businesses is the right one for anything
      commercial: the Financial District has almost no residents and enormous
      daytime activity, so its per-capita street-cleaning rate is close to
      meaningless.

      Events outside every neighborhood are excluded rather than bucketed
      into an Unknown row, so this mart's total is lower than
      int_point_activity's and is the sum of its neighborhoods.
    columns:
      - name: analysis_neighborhood
        description: Neighborhood name. Part of the grain.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_neighborhood')
                field: analysis_neighborhood

      - name: dataset
        description: Registry name of the source. Part of the grain.
        tests:
          - not_null

      - name: category
        description: The dataset's own category dimension. Part of the grain.
        tests:
          - not_null

      - name: event_month
        description: First day of the month. Part of the grain.
        tests:
          - not_null

      - name: event_count
        description: Events in this neighborhood, dataset, category and month.
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 1}

      - name: events_per_1000_residents
        description: >
          The default normalised companion. Null where the neighborhood has
          no residents.

      - name: events_per_1000_businesses
        description: >
          The right companion for anything commercial, and the one that most
          changes the ranking against per-capita.

      - name: events_per_sq_km
        description: Density. Unlike the H3 mart, neighborhood areas genuinely differ.

    tests:
      - unique_combination:
          arguments:
            columns: [analysis_neighborhood, dataset, category, event_month]

  - name: mart_film_locations
    description: >
      One row per published film location record, joined to the neighborhood
      it is actually in, with a count of how many locations each title used.

      It also settles a question. ADR-3 demoted this dataset partly because
      "its locations are free text rather than coordinates, so it cannot
      participate in ADR-2". The free-text column is real, but the dataset
      also publishes flat latitude and longitude, usable on 2,127 of 2,214
      rows. No geocoding decision was needed because there was nothing to
      geocode, and ADR-7 corrects the record.
    columns:
      - name: film_location_id
        description: Socrata row id. The grain of this model.
        tests:
          - unique
          - not_null

      - name: film_title
        description: Title of the film or show. Repeats, once per location it used.
        tests:
          - not_null

      - name: analysis_neighborhood
        description: >
          The neighborhood this shoot location is in, computed from its
          coordinates. Null on the rows with no usable coordinate.
        tests:
          - relationships:
              arguments:
                to: ref('dim_neighborhood')
                field: analysis_neighborhood

      - name: upstream_analysis_neighborhood
        description: >
          The neighborhood DataSF stamped on the row. Kept beside the
          computed one because this is the smallest dataset in the warehouse
          and therefore the cheapest place to eyeball how often the two agree.

      - name: locations_for_title
        description: How many location records this title has. The window function.
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 1}

      - name: neighborhoods_for_title
        description: How many distinct neighborhoods this title was shot in.

  - name: mart_budget_by_department_year
    description: >
      One row per fiscal year per department per ledger type. The non-spatial
      mart: city budget rolled up from line items, with year-over-year change
      and each department's share of the year.

      What it deliberately does not do is join budget to 311. That needs a
      crosswalk between budget department_code and the 311 agency_responsible
      field, two independently maintained taxonomies with no reason to agree.
      ADR-3 blocked any budget mart until that crosswalk existed; ADR-7
      revisits it, on the grounds that the objection was always to the
      crosswalk rather than to the budget data. The spend-versus-demand
      question is still open.

      ledger_type is part of the grain and must stay in your group by:
      revenue and spending are rows of the same shape, and summing without
      splitting them nets a department's income against its outgoings.
    columns:
      - name: fiscal_year
        description: Fiscal year. Part of the grain.
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 2000, max_value: 2100}

      - name: ledger_type
        description: Revenue or Spending. Part of the grain, and not optional.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Revenue", "Spending"]
              config:
                severity: warn

      - name: department_code
        description: >
          Short department code, e.g. HSA. Part of the grain, and the column
          a future crosswalk to 311 agency_responsible would join on.
        tests:
          - not_null

      - name: budget_amount
        description: >
          Summed dollars over the lines whose amount parsed. Negative values
          are legitimate transfers out and appropriation reversals; filtering
          them to make a chart behave breaks the totals.

          Null, deliberately and without a not_null test, when not one line in
          the group had a readable amount. Zero would be a claim about the
          city's budget; null is a statement about our data, and
          unparseable_line_count says how big the gap is. Real DataSF extracts
          have not produced this, but the fixtures do, which is the whole
          reason the fixtures carry a malformed amount.

      - name: unparseable_line_count
        description: >
          Lines in this group whose amount could not be parsed. Zero on every
          group in the real dataset. Above zero means budget_amount understates
          the group, and equal to line_item_count means budget_amount is null.
        tests:
          - not_null

      - name: year_over_year_change
        description: >
          Change against the same department and ledger type last year. Null
          in a department's first year, which is a real absence.

      - name: year_over_year_pct_change
        description: >
          The normalised companion. Null rather than infinite where a
          department had nothing last year, and computed against the absolute
          prior amount so a negative baseline does not flip the sign.

      - name: pct_of_citywide_amount
        description: Share of that year's citywide total for the same ledger type.

    tests:
      - unique_combination:
          arguments:
            columns: [fiscal_year, ledger_type, department_code]
