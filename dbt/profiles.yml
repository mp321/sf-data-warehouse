# This contains no secrets.
# Everything sensitive comes from environment variables, so the exact
# same file works on local and in GitHub Actions.
#
# Run dbt from this folder with:
#   export DBT_PROFILES_DIR="$(pwd)"
# (SETUP.md walks through this. The Makefile does it for you.)
#
# Two targets, per ADR-1 (docs/decisions/adr-1-warehouse-targets.md):
#
#   duckdb     Local DuckDB. The default. No credentials, no network. This
#              is what CI builds and tests on every pull request.
#   bigquery   BigQuery. Needs real credentials. Same models, same sources,
#              built on a schedule.
#
# Pick one with: dbt build --target bigquery
#
# The BigQuery output was called `dev` until the DuckDB switch. It is named
# for the engine now, because "dev" stopped describing anything once the
# credential-free target became the one you develop against.
#
# Both targets read raw tables out of a `raw_datasf` schema that
# `ingestion/load.py` materialises from the Parquet zone. dbt-duckdb can read
# Parquet directly through a source `external_location` instead, and that was
# the earlier plan; it was dropped because it makes the DuckDB and BigQuery
# source definitions structurally different, and the whole point of ADR-1 is
# that one set of models runs unchanged on both. Loading first costs a step
# and buys symmetry.
#
# Note on the env_var defaults below: dbt renders this entire file before
# it picks a target, so a bare env_var('X') with no default would blow up
# on the BigQuery block even when you are running against DuckDB. The
# empty-string defaults keep the DuckDB path credential-free. If you run
# the BigQuery target without setting them, dbt fails at connection time
# with a clear message instead of at parse time with a confusing one.

sf_data_warehouse:
  target: duckdb
  outputs:

    duckdb:
      type: duckdb
      # Relative to this folder (dbt/). Gitignored via *.duckdb.
      # ingestion/load.py writes the same file; keep the two in step by
      # setting DUCKDB_PATH rather than editing one of them.
      path: "{{ env_var('DUCKDB_PATH', '../data/sf.duckdb') }}"
      threads: 4
      schema: main

    bigquery:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', '') }}"
      project: "{{ env_var('GCP_PROJECT_ID', '') }}"
      dataset: dbt_dev
      threads: 4
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      job_execution_timeout_seconds: 600
