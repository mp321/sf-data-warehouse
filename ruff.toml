# Ruff config. Kept in its own file rather than pyproject.toml because this
# repo is not a Python package and adding a pyproject.toml would imply it is.

line-length = 100
target-version = "py310"

exclude = [
    ".venv",
    "dbt/target",
    "dbt/dbt_packages",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "PL",   # pylint subset
    "RUF",  # ruff-specific
]

ignore = [
    # Several functions take a handful of keyword arguments that are genuinely
    # independent (table, rows, run_id, seq, ingest_date, root). Splitting them
    # into a config object would add a type to carry six unrelated scalars.
    # PLR0917, the positional-argument count, is deliberately left enabled: the
    # ones that mattered were fixed by making the tail keyword-only.
    "PLR0913",
    "PLR2004",  # magic value comparison: noisy on retry and page-size logic
]

[lint.isort]
# `datasets` and `raw_zone` are sibling modules in ingestion/, imported by the
# scripts that live beside them. Ruff otherwise classifies `datasets` as
# third-party, because a PyPI package owns that name, and demands it be sorted
# into the third-party block where it would read as an external dependency.
#
# This makes the grouping correct. It does not remove the underlying hazard,
# which is that `ingestion/datasets.py` shadows and is shadowed by the
# HuggingFace `datasets` package if that ever lands in the venv. The fix for
# that is a rename and is still tracked in docs/plans/plan-2-ingestion-lint.md.
known-first-party = [
    "census",
    "datasets",
    "derived_zone",
    "geometry",
    "raw_zone",
    "remote",
    "spatial",
]

[format]
quote-style = "double"
