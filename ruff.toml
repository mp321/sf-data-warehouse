# Ruff config. Kept in its own file rather than pyproject.toml because this
# repo is not a Python package and adding a pyproject.toml would imply it is.

line-length = 100
target-version = "py310"

exclude = [
    ".venv",
    "dbt/target",
    "dbt/dbt_packages",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "PL",   # pylint subset
    "RUF",  # ruff-specific
]

ignore = [
    # Several functions take a handful of keyword arguments that are genuinely
    # independent (table, rows, run_id, seq, ingest_date, root). Splitting them
    # into a config object would add a type to carry six unrelated scalars.
    # PLR0917, the positional-argument count, is deliberately left enabled: the
    # ones that mattered were fixed by making the tail keyword-only.
    "PLR0913",
    "PLR2004",  # magic value comparison: noisy on retry and page-size logic
]

[lint.isort]
# These are the sibling modules in ingestion/, imported by the scripts that
# live beside them. Ruff would otherwise classify any of them that a PyPI
# package also claims as third-party and demand it be sorted into the
# third-party block, where it would read as an external dependency.
#
# `datasets` is not on this list any more. It was renamed to
# `dataset_registry` in PLAN-5 step 7, which closed PLAN-2, because
# known-first-party fixed the grouping and left the hazard: `import datasets`
# resolves to whichever of ingestion/ and site-packages comes first on
# sys.path, and ingestion/ wins, so a venv holding the PyPI `datasets` package
# would keep working for us and break for whatever pulled it in.
#
# THE OTHER NAMES HERE KEEP THEIRS, deliberately. The hazard is not
# "generic-sounding name", it is "name a package this dependency tree could
# plausibly acquire". `datasets` is that: HuggingFace `datasets` is a routine
# transitive arrival in anything data-adjacent. `boundaries`, `population`,
# `derived_zone`, `h3_points`, `spatial` and `raw_zone` have no such package in
# reach of dbt, pyarrow, h3, duckdb or gcsfs. `census` and `geometry` are the
# nearest runners-up, since both names exist on PyPI and `census` is even
# thematically apt, but nothing here imports either and neither is a
# dependency of anything here. Renaming six modules against a hazard with no
# arrival path is churn, and it would not fix the class anyway: the only real
# fix is making ingestion/ a package, which tests/conftest.py argues against
# and which is a bigger decision than a lint config. Revisit the day one of
# these names shows up in `pip list`.
known-first-party = [
    "boundaries",
    "census",
    "dataset_registry",
    "derived_state",
    "derived_zone",
    "geometry",
    "h3_points",
    "population",
    "raw_zone",
    "remote",
    "spatial",
    # `load` joined the list on 2026-08-05, when scripts/parity-check.py became
    # the first thing to import it rather than run it: --columns reads
    # RAW_SCHEMA, DERIVED_SCHEMA, DERIVED_TABLES and RUNS_TABLE from it instead
    # of keeping a second copy of four names that have to agree. Without it here
    # ruff sorted `import load` into the third-party block above the siblings it
    # sits beside in ingestion/, which reads as a dependency and is the exact
    # confusion this list exists to prevent.
    "load",
]

[format]
quote-style = "double"
