name: ci

# The pull request gate. Everything here runs without credentials, which is
# deliberate: it means CI also works on pull requests from forks, where
# repository secrets are not available.
#
# The credentialed work lives in the other two workflows and stays on its
# schedule: ingest.yml (daily, BigQuery) and dbt.yml (weekly build against
# BigQuery). Nothing here touches them.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  leak-check:
    name: leak-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the script can see the whole tree, not a
          # partial checkout. It scans the working tree, not history.
          fetch-depth: 0

      - name: Scan for credentials
        run: bash scripts/leak-check.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      - name: sqlfluff lint
        env:
          DBT_PROFILES_DIR: dbt
        run: sqlfluff lint dbt/models --processes 4

  dbt-duckdb:
    name: dbt (duckdb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create local data directory
        run: mkdir -p data

      - name: dbt deps
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: "."
        run: dbt deps

      # parse catches broken refs, bad macro calls and Jinja errors.
      # compile additionally renders every model to real SQL, which is what
      # catches engine-specific syntax that slipped past the cross_engine
      # macros in macros/cross_engine.sql.
      - name: dbt parse
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: "."
        run: dbt parse --target duckdb

      - name: dbt compile
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: "."
        run: dbt compile --target duckdb

      # A full `dbt build --target duckdb` is the goal and is blocked on the
      # Parquet raw zone. See docs/plans/plan-1-duckdb-parquet.md
      # step 3. Swap the compile step above for this once that lands:
      #
      # - name: dbt build
      #   working-directory: dbt
      #   env:
      #     DBT_PROFILES_DIR: "."
      #   run: dbt build --target duckdb

      - name: Upload compiled SQL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-sql
          path: dbt/target/compiled/
          retention-days: 7
          if-no-files-found: ignore
