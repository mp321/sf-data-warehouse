name: ci

# The pull request gate. Everything here runs without credentials, which is
# deliberate: it means CI also works on pull requests from forks, where
# repository secrets are not available.
#
# Since ADR-4 split ingestion from loading, that buys more than it used to.
# The dbt-duckdb job below is a real end-to-end run, not a compile: it builds
# the Parquet raw zone from committed fixtures, loads it into DuckDB, then
# runs and tests every model. A broken model, a broken macro, a broken loader
# or a broken staging contract all fail here rather than on Monday.
#
# The credentialed work stays on its schedule: ingest.yml (daily) and dbt.yml
# (weekly build against BigQuery).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  leak-check:
    name: leak-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the script can see the whole tree, not a
          # partial checkout. It scans the working tree, not history.
          fetch-depth: 0

      - name: Scan for credentials
        run: bash scripts/leak-check.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: dbt
      # sqlfluff runs the dbt templater from the repo root, and dbt-duckdb
      # resolves a relative path against the current directory, so the
      # ../data/sf.duckdb default in profiles.yml would land outside the
      # workspace. Absolute, as the Makefile also does.
      DUCKDB_PATH: ${{ github.workspace }}/data/sf.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Create local data directory
        run: mkdir -p data/raw

      # Before the linters, not after. If the pinned ruff and the installed
      # ruff have come apart, every result below this point is being produced
      # by a different linter than the one the contributor ran, and that is
      # worth saying plainly rather than leaving someone to infer it from a
      # rule code they cannot reproduce locally.
      - name: check lint pins
        run: bash scripts/check-lint-pins.sh

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      - name: sqlfluff lint
        run: sqlfluff lint dbt/models dbt/tests --processes 4

  python-tests:
    name: pytest (geometry, registry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # requirements-dev.txt rather than `pip install pytest`, because that
      # file is where the pytest version is declared and a second list here
      # would be free to drift from it. Same reasoning as the ruff pin check.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest tests -q

  # This is the only job that waits for another one, and the edge is deliberate.
  # Jobs in a workflow run in parallel unless something says otherwise, so
  # "run the fastest gate before the dbt job" is a `needs:` edge and not step
  # order: without it, a broken point-in-polygon test and the five-minute
  # end-to-end build it invalidates would report at the same moment, and the
  # second failure would be read as a modelling problem.
  #
  # It waits on python-tests and not on lint, and python-tests gates this job
  # and not dbt-bigquery-compile, because the dependency is real in exactly one
  # direction: this job runs ingestion/spatial.py, so geometry.py failing in
  # pytest predicts what fails here. Nothing about a lint failure does, and the
  # BigQuery job never executes Python geometry at all.
  dbt-duckdb:
    name: dbt (duckdb, end to end)
    runs-on: ubuntu-latest
    needs: python-tests
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      DUCKDB_PATH: ${{ github.workspace }}/data/sf.duckdb
      RAW_ZONE_DIR: ${{ github.workspace }}/data/raw
      DERIVED_ZONE_DIR: ${{ github.workspace }}/data/derived
      PUBLISH_DIR: ${{ github.workspace }}/published
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      # Same code path as production ingestion; only the transport differs.
      # See tests/fixtures/README.md for what the fixtures deliberately
      # contain and why they are JSON rather than Parquet.
      - name: Build the Parquet raw zone from fixtures
        run: python ingestion/ingest.py --all --fixtures tests/fixtures/socrata

      # Does every run manifest describe the Parquet beside it (PLAN-7 step 1)?
      # Here rather than only on a real zone because the fixture run writes the
      # manifests through the same `_flush` and `_finish` the scheduled run
      # uses, so a change that makes ingestion misreport itself fails on a fork
      # pull request with no credentials and no bucket. Exits 3 on a manifest
      # that disagrees and 4 on rows no manifest describes.
      - name: Reconcile the run manifests against the zone
        run: python ingestion/check_runs.py --strict

      # The H3 precompute (ADR-5, ADR-6). Runs on the committed boundary
      # fixtures, which are real polygons with thinned vertices, so this
      # genuinely exercises the covering-cell classifier, the exact
      # point-in-polygon refinement and the population interpolation rather
      # than stubbing them. Its internal assertions, that population is
      # conserved at every resolution and that the two point-in-polygon
      # implementations agree on the sample, fail the build here.
      - name: Precompute H3 cells and boundary membership
        run: python ingestion/spatial.py --all

      - name: Load both zones into DuckDB
        run: python ingestion/load.py --all --target duckdb

      - name: dbt build
        working-directory: dbt
        run: dbt build

      # Does the committed context pack still describe the warehouse (PLAN-6
      # step 4, ADR-13)? Exits 3 when it does not.
      #
      # AGAINST THE FIXTURE WAREHOUSE, AND IT NEVER GENERATES ONE. Nothing here
      # writes context-pack/: a pack built on a runner would carry the fixture
      # zone's row counts, profiles and example results, and committing that
      # would make the artifact describe a warehouse no consumer will read.
      # What --check compares is the target name, the prose revision, the spec
      # version and the per-model schema hash, and none of those four depend on
      # how many rows a fixture holds. Measured 2026-08-07: all 19 hashes here
      # are identical to the real warehouse's.
      #
      # So a column added, removed, renamed, retyped or reordered fails this
      # step, as does an edit to prose.yml or to the spec with no regeneration.
      # A row count moving does not, deliberately: it moves on every ingest and
      # a gate that fires daily is a gate someone switches off.
      #
      # The fix when it fires is `make build && make context-pack` on a machine
      # with the real zone, then commit both artifacts. Regenerating from
      # fixtures to make this green is the one wrong answer.
      - name: Check the committed context pack against the warehouse
        run: python tools/context_pack/generate.py --target duckdb --check

      # The published export is part of the gate, not an afterthought. It is
      # the only step that reads every mart at once, so a mart that builds but
      # cannot be serialised fails here rather than in whatever consumes the
      # bucket. Local destination only: no bucket, no credentials.
      - name: Export published marts
        run: python publish/export.py --all

      # The same gate for the second pack, against the export the step above
      # just wrote from the fixture warehouse (PLAN-8, ADR-13). It writes
      # nothing either, and for the same reason: a published pack built here
      # would carry a seven-row zone's row counts and example results.
      #
      # What makes this checkable on a runner is that the published pack's
      # schema hash is over the Parquet as written, and the types in a Parquet
      # file do not depend on how many rows went into it. The one thing to know
      # is that three of the six hashes differ from the ones in
      # published/manifest.json, because HUGEINT has no Parquet type and comes
      # back as DOUBLE; that difference is a property of the format, is the
      # same here as on a real export, and the pack records both numbers.
      #
      # The fix when it fires is `make publish && make context-pack
      # TARGET=published` on a machine with the real zone, then commit both
      # artifacts. Regenerating from fixtures to make it green is the same
      # wrong answer as above.
      - name: Check the committed published pack against the export
        run: python tools/context_pack/generate.py --target published --check

      # Proves the claim in the Makefile and in ADR-4: the zones are the
      # source of truth, so dropping the warehouse entirely and reloading
      # reproduces every model. If this step ever fails, something has crept
      # into the warehouse that the zones cannot regenerate.
      #
      # Note that data/derived is deliberately NOT rebuilt here. It is a pure
      # function of data/raw, and reloading it from the files spatial.py
      # already wrote is what proves the load step is idempotent. Re-running
      # spatial.py instead would test a different claim.
      - name: Rebuild from the zones after dropping the warehouse
        run: |
          rm -f data/sf.duckdb data/sf.duckdb.wal
          python ingestion/load.py --all --target duckdb
          cd dbt && dbt build

      - name: Upload compiled SQL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-sql
          path: dbt/target/compiled/
          retention-days: 7
          if-no-files-found: ignore

  dbt-bigquery-compile:
    name: dbt (bigquery, compile only)
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      # Renders every model as BigQuery SQL with no warehouse and no secrets,
      # which is what catches DuckDB-only syntax that the end-to-end job above
      # cannot see, such as try_cast or json_extract_string leaking past the
      # dispatch macros in macros/cross_engine.sql. It is also the only check a
      # fork pull request can run against the second engine.
      #
      # No env block on purpose. The target mints its own throwaway key and
      # sets its own placeholder project, so this step and a local
      # `make compile-bigquery` are the same run. Anything set here would be
      # a second place for the two to disagree, which is the drift that made
      # the 2026-08-01 and 2026-08-02 failures hard to reproduce.
      #
      # What makes this credential-free is in the Makefile target and in
      # scripts/fake-bq-key.sh, not here. Do not restate it: this comment is
      # allowed to point, not to explain.
      - name: dbt compile against BigQuery
        run: make compile-bigquery DBT=dbt DBT_DIR=dbt

      # dbt writes a debug-level log regardless of console verbosity, and it
      # carries the traceback that the console error omits. Twice now the
      # console message ("Failed to authenticate with supplied credentials")
      # named the symptom and nothing about the caller, and both times the next
      # step was to guess. Keep the log so the next occurrence starts with a
      # stack instead.
      - name: Upload dbt log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-bigquery-compile-log
          path: dbt/logs/dbt.log
          retention-days: 7
          if-no-files-found: ignore
