name: dbt

# Scheduled build against BigQuery, the secondary target (ADR-1).
# This is the credentialed job and it stays on a schedule, not on pull
# requests, because it needs repository secrets that fork PRs cannot see.
# The per-PR gate is .github/workflows/ci.yml, which is credential-free.

on:
  schedule:
    # 10:23 UTC every Monday, an hour after the daily ingestion window.
    - cron: "23 10 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dbt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Installs both adapters. profiles.yml now defines a duckdb output
      # alongside the BigQuery one, and installing the full requirements
      # file removes any chance of dbt tripping over an adapter it cannot
      # import while resolving the profile.
      - name: Install dbt
        run: pip install -r ../requirements.txt

      - name: Write service account key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/sa.json"

      - name: dbt deps
        env:
          DBT_PROFILES_DIR: "."
        run: dbt deps

      - name: Build and test all models
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          DBT_PROFILES_DIR: "."
        run: dbt build --target dev

      - name: Check source freshness
        continue-on-error: true
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          DBT_PROFILES_DIR: "."
        run: dbt source freshness

      # The key is written to RUNNER_TEMP, which GitHub discards with the
      # runner, but removing it explicitly costs nothing and means a step
      # added below this line later cannot read it by accident.
      - name: Remove service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
